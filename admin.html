<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d4af37">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<title>لوحة الأستاذ | منصة محمد عيسى</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .admin-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 30px;
    border-bottom: 2px solid rgba(212,175,55,0.15);
    flex-wrap: wrap;
    padding-bottom: 0;
  }
  .admin-tabs .tab {
    padding: 14px 22px;
    font-size: 14px;
  }
  .item-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: center;
    background: linear-gradient(145deg, rgba(212,175,55,0.06), rgba(212,175,55,0.02));
    border-right: 3px solid var(--gold);
    padding: 16px 20px;
    border-radius: 12px;
    margin-bottom: 10px;
    transition: all 0.3s;
  }
  .item-row:hover {
    background: rgba(212,175,55,0.12);
    transform: translateX(-3px);
  }
  .item-info h4 {
    color: var(--gold);
    font-size: 16px;
    margin-bottom: 4px;
    font-weight: 800;
  }
  .item-info p {
    color: #999;
    font-size: 12px;
  }
  .item-actions {
    display: flex;
    gap: 6px;
  }
  .item-actions button {
    padding: 8px 12px;
    font-size: 13px;
    border-radius: 8px;
  }
  .timer-badge {
    display: inline-block;
    background: rgba(212,175,55,0.15);
    color: var(--gold);
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    margin-left: 6px;
    border: 1px solid rgba(212,175,55,0.3);
  }
  .timer-badge.danger {
    background: rgba(231,76,60,0.15);
    color: #ff6b6b;
    border-color: rgba(231,76,60,0.3);
  }
  .timer-badge.success {
    background: rgba(39,174,96,0.15);
    color: #2ecc71;
    border-color: rgba(39,174,96,0.3);
  }
</style>
</head>
<body>

<nav>
  <div class="logo">
    <div class="logo-icon">م.ع</div>
    <div class="logo-text">
      <span class="logo-name">لوحة الأستاذ</span>
      <span class="logo-tag">محمد عيسى</span>
    </div>
  </div>
  <div class="nav-links">
    <a href="index.html">الرئيسية</a>
    <button class="btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
  </div>
</nav>

<section id="adminPanel" class="dashboard" style="display:block">
  <div class="dash-header">
    <h2>👑 مرحباً أستاذ محمد</h2>
    <p style="color:#aaa">إدارة كاملة للمنصة</p>
  </div>
  <div class="tabs admin-tabs">
    <button class="tab active" onclick="switchAdminTab('adminCourses', this)">📚 الكورسات</button>
    <button class="tab" onclick="switchAdminTab('adminLessons', this)">🎬 الدروس</button>
    <button class="tab" onclick="switchAdminTab('adminExams', this)">📝 الامتحانات</button>
    <button class="tab" onclick="switchAdminTab('adminHomeworks', this)">📓 الواجبات</button>
    <button class="tab" onclick="switchAdminTab('adminAnnouncements', this)">📢 الإعلانات</button>
    <button class="tab" onclick="switchAdminTab('adminStudents', this)">👥 الطلاب</button>
  </div>
  <div id="adminTabContent"></div>
</section>

<div class="modal-overlay" id="adminModal">
  <div class="modal" style="max-width:600px">
    <button class="close-btn" onclick="closeAdminModal()">✕</button>
    <h2 id="adminModalTitle">إضافة</h2>
    <div id="adminModalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<a href="https://t.me/sayoda_elgadar" target="_blank" class="telegram-float">
  <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
    <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/>
  </svg>
</a>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/session.js"></script>
<script src="js/auth.js"></script>
<script src="js/courses.js"></script>
<script src="js/admin.js"></script>
<script>
(async function initAdmin() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session?.user) {
    window.location.href = 'login.html';
    return;
  }
  currentUser = session.user;

  const { data: adminRow } = await supabaseClient
    .from('admins').select('id').eq('id', currentUser.id).maybeSingle();

  if (!adminRow) {
    alert('غير مصرح لك بالدخول');
    window.location.href = 'index.html';
    return;
  }

  await startSession(currentUser.id);
  isAdmin = true;
  switchAdminTab('adminCourses');
})();
</script>
</body>
</html>
