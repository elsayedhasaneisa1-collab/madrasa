<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d4af37">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="https://fav.farm/🎓">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<title>تسجيل الدخول | منصة الأستاذ محمد عيسى</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">

<div class="auth-container">
  <div class="auth-brand">
    <div class="logo-icon big">م.ع</div>
    <h1>منصة الأستاذ محمد عيسى</h1>
    <p>سجّل دخولك للمتابعة إلى كورساتك</p>
  </div>

  <div class="auth-card">
    <div class="tabs-auth">
      <a href="login.html" class="auth-tab active">دخول</a>
      <a href="register.html" class="auth-tab">حساب جديد</a>
    </div>

    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="form-group">
        <label><i class="fas fa-envelope" style="color:var(--gold);"></i> البريد الإلكتروني</label>
        <input type="email" id="email" required placeholder="example@mail.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label><i class="fas fa-lock" style="color:var(--gold);"></i> كلمة المرور</label>
        <input type="password" id="password" required minlength="6" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-block" id="authSubmit">
        <i class="fas fa-sign-in-alt"></i> دخول
      </button>
    </form>

    <div class="auth-footer-links">
      <p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
      <a href="index.html" class="back-link">← العودة للرئيسية</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/session.js"></script>
<script src="js/auth.js"></script>
<script>
authMode = 'login';

(async function initLogin() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session?.user) {
    window.location.href = 'index.html';
    return;
  }
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (session?.user) window.location.href = 'index.html';
  });
})();
</script>
</body>
</html>
