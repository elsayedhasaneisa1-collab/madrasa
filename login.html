<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | منصة الأستاذ محمد عيسى</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">

<div class="auth-container">
  <div class="auth-brand">
    <div class="logo-icon big">م</div>
    <h1>منصة الأستاذ محمد عيسى</h1>
    <p>سجّل دخولك للمتابعة إلى كورساتك</p>
  </div>

  <div class="auth-card">
    <div class="tabs-auth">
      <button class="auth-tab active" data-mode="login" onclick="setAuthMode('login')">دخول</button>
      <button class="auth-tab" data-mode="signup" onclick="setAuthMode('signup')">حساب جديد</button>
    </div>

    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="form-group" id="nameGroup" style="display:none">
        <label>الاسم الكامل</label>
        <input type="text" id="fullName" placeholder="أدخل اسمك">
      </div>
      <div class="form-group" id="phoneGroup" style="display:none">
        <label>رقم الهاتف</label>
        <input type="tel" id="phone" placeholder="01xxxxxxxxx">
      </div>
      <div class="form-group" id="gradeGroup" style="display:none">
        <label>الصف الدراسي</label>
        <select id="grade">
          <option value="">اختر الصف</option>
          <option>الأول الثانوي</option>
          <option>الثاني الثانوي</option>
          <option>الثالث الثانوي</option>
        </select>
      </div>
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" required placeholder="example@mail.com">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" required minlength="6" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-block" id="authSubmit">دخول</button>
    </form>

    <div class="auth-footer">
      <a href="index.html">← العودة للرئيسية</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
function setAuthMode(mode) {
  authMode = mode;
  document.querySelectorAll('.auth-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.mode === mode)
  );
  updateAuthUI();
}
// تحديث دالة updateAuthUI لتتعامل مع تبويبات صفحة login
const originalUpdateAuthUI = updateAuthUI;
updateAuthUI = function () {
  originalUpdateAuthUI();
  const isSignup = authMode === 'signup';
  const title = document.getElementById('authTitle');
  if (!title) return;
};

// تهيئة الصفحة
(async function initLogin() {
  updateAuthUI();
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session?.user) window.location.href = 'index.html';
  
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (session?.user) window.location.href = 'index.html';
  });
})();
</script>
</body>
</html>
